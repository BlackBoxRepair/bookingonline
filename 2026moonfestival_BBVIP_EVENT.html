<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />

  <title>中秋月禮｜會員限定活動</title>

  <style>
    :root {
      --navy: #042741;
      --navy-deep: #031c30;
      --gold: #f7b500;
      --gold-light: #ffd65c;
      --white: #ffffff;

      --text-soft: rgba(255,255,255,.68);
      --line: rgba(255,255,255,.10);

      --radius: 22px;
      --shadow: 0 12px 32px rgba(0,0,0,.18);
    }


    /* ==================================================
       基本設定
    ================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      background: var(--navy);
      color: var(--white);
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }


    /* ==================================================
       共用
    ================================================== */

    .container {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
    }

    .section {
      padding: 34px 0;
    }

    .section-header {
      margin-bottom: 20px;
    }

    .section-title {
      margin: 0 0 8px;

      color: var(--white);

      font-size: 26px;
      font-weight: 850;
      letter-spacing: .4px;
    }

    .section-subtitle {
      margin: 0;

      color: var(--text-soft);

      font-size: 14px;
      line-height: 1.7;
    }


    /* ==================================================
       頂端 LOGO
    ================================================== */

    .site-header {
      position: relative;
      z-index: 10;

      width: 100%;

      background: #ffffff;

      border-bottom:
        1px solid rgba(0,0,0,.055);
    }

    .site-header-inner {
      min-height: 78px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 12px 0;
    }

    .logo-area {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-area img {
      display: block;

      width: auto;
      height: auto;

      max-width: 220px;
      max-height: 48px;

      object-fit: contain;
    }


    /* ==================================================
       活動主視覺
    ================================================== */

    .campaign-visual {
      width: 100%;

      margin: 0;
      padding: 0;

      background: var(--navy);

      overflow: hidden;
    }

    .campaign-image {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;
      padding: 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      box-shadow: none;
    }

    .campaign-image img {
      display: block;

      width: 100%;
      height: auto;

      margin: 0;
      padding: 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      box-shadow: none;
    }


    /* ==================================================
       預約區
    ================================================== */

    .booking-section {
      padding-top: 28px;
      background: var(--navy);
    }

    .booking-card {
      width: 100%;
      min-width: 0;

      padding: 24px;

      border:
        1px solid var(--line);

      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.035)
        );

      box-shadow: var(--shadow);
    }

    .form {
      width: 100%;
      min-width: 0;

      display: grid;
      gap: 18px;
    }

    .field {
      width: 100%;
      min-width: 0;

      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--white);

      font-size: 14px;
      font-weight: 750;
    }

    .required::after {
      content: " *";
      color: var(--gold);
    }


    /* ==================================================
       輸入欄位
    ================================================== */

    input,
    select {
      display: block;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      min-height: 52px;

      padding: 0 15px;

      color: var(--white);

      border:
        1px solid rgba(255,255,255,.13);

      border-radius: 14px;

      background:
        rgba(255,255,255,.075);

      outline: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input::placeholder {
      color:
        rgba(255,255,255,.36);
    }

    input:focus,
    select:focus {
      border-color: var(--gold);

      background:
        rgba(255,255,255,.095);

      box-shadow:
        0 0 0 3px
        rgba(247,181,0,.12);
    }

    select {
      cursor: pointer;
    }

    select option {
      color: #111111;
      background: #ffffff;
    }

    select optgroup {
      color: #777777;
      background: #ffffff;
      font-weight: 700;
    }


    /* ==================================================
       日期欄位
       防止 iPhone / Safari 超出表單
    ================================================== */

    .date-field {
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    input[type="date"] {
      display: block;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      box-sizing: border-box;

      color-scheme: dark;
    }


    /* ==================================================
       門市選擇按鈕
    ================================================== */

    .store-options {
      width: 100%;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 10px;
    }

    .store-button {
      position: relative;

      width: 100%;
      min-width: 0;
      min-height: 58px;

      padding: 10px 8px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius: 15px;

      background:
        rgba(255,255,255,.065);

      color:
        rgba(255,255,255,.82);

      font-size: 14px;
      font-weight: 750;

      text-align: center;

      cursor: pointer;

      transition:
        background .18s ease,
        border-color .18s ease,
        color .18s ease,
        transform .15s ease,
        box-shadow .18s ease;
    }

    .store-button:hover {
      background:
        rgba(255,255,255,.09);
    }

    .store-button:active {
      transform: scale(.98);
    }

    .store-button.selected {
      color: var(--navy);

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      border-color: var(--gold);

      box-shadow:
        0 8px 22px
        rgba(247,181,0,.18);
    }

    .store-button.selected::before {
      content: "✓";

      margin-right: 6px;

      font-size: 14px;
      font-weight: 900;
    }


    /* ==================================================
       尚未選擇門市的時段
    ================================================== */

    select:disabled {
      cursor: not-allowed;

      color:
        rgba(255,255,255,.35);

      background:
        rgba(255,255,255,.04);

      border-color:
        rgba(255,255,255,.08);

      opacity: 1;
    }


    /* ==================================================
       確認核選框
    ================================================== */

    .agreement {
      width: 100%;

      display: flex;
      align-items: flex-start;

      gap: 11px;

      padding: 15px 16px;

      border:
        1px solid rgba(247,181,0,.24);

      border-radius: 15px;

      background:
        rgba(247,181,0,.065);

      cursor: pointer;
    }

    .agreement input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;

      flex: 0 0 21px;

      width: 21px;
      height: 21px;
      min-width: 21px;
      min-height: 21px;

      margin: 1px 0 0 0;
      padding: 0;

      border:
        1.5px solid rgba(255,255,255,.45);

      border-radius: 6px;

      background:
        rgba(255,255,255,.06);

      display: grid;
      place-content: center;

      cursor: pointer;
    }

    .agreement input[type="checkbox"]::before {
      content: "";

      width: 10px;
      height: 6px;

      border-left:
        2px solid var(--navy);

      border-bottom:
        2px solid var(--navy);

      transform:
        rotate(-45deg)
        scale(0);

      transition:
        transform .12s ease;
    }

    .agreement input[type="checkbox"]:checked {
      border-color: var(--gold);
      background: var(--gold);
    }

    .agreement input[type="checkbox"]:checked::before {
      transform:
        rotate(-45deg)
        scale(1);
    }

    .agreement-text {
      color:
        rgba(255,255,255,.88);

      font-size: 13px;
      line-height: 1.65;

      font-weight: 650;
    }


    /* ==================================================
       送出按鈕
    ================================================== */

    .submit-button {
      width: 100%;
      min-height: 56px;

      margin-top: 2px;

      border: 0;
      border-radius: 16px;

      color: var(--navy);

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      font-size: 17px;
      font-weight: 850;

      box-shadow:
        0 10px 26px
        rgba(247,181,0,.23);

      cursor: pointer;

      transition:
        transform .15s ease,
        opacity .15s ease,
        box-shadow .15s ease;
    }

    .submit-button:hover {
      box-shadow:
        0 12px 30px
        rgba(247,181,0,.3);
    }

    .submit-button:active {
      transform: scale(.985);
    }


    /* ==================================================
       活動說明
    ================================================== */

    .activity-card {
      overflow: hidden;

      border:
        1px solid var(--line);

      border-radius: var(--radius);

      background:
        rgba(255,255,255,.055);
    }

    .activity-item {
      display: flex;
      align-items: flex-start;

      gap: 15px;

      padding: 19px 20px;

      border-bottom:
        1px solid var(--line);
    }

    .activity-item:last-child {
      border-bottom: 0;
    }

    .activity-number {
      flex: 0 0 30px;

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(247,181,0,.14);

      color: var(--gold);

      font-size: 13px;
      font-weight: 850;
    }

    .activity-content {
      min-width: 0;
      padding-top: 2px;
    }

    .activity-title {
      margin-bottom: 5px;

      color: var(--white);

      font-size: 15px;
      font-weight: 800;
    }

    .activity-text {
      color: var(--text-soft);

      font-size: 13px;
      line-height: 1.75;
    }


    /* ==================================================
       資訊
    ================================================== */

    .information-section {
      padding-bottom: 56px;
    }

    .information-card {
      overflow: hidden;

      border:
        1px solid var(--line);

      border-radius: var(--radius);

      background:
        rgba(255,255,255,.055);
    }

    .info-link {
      min-height: 66px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      padding: 0 20px;

      border-bottom:
        1px solid var(--line);

      transition:
        background .18s ease;
    }

    .info-link:last-child {
      border-bottom: 0;
    }

    .info-link:hover {
      background:
        rgba(255,255,255,.045);
    }

    .info-link:active {
      background:
        rgba(255,255,255,.08);
    }

    .info-name {
      color: var(--white);

      font-size: 15px;
      font-weight: 750;
    }

    .info-arrow {
      color: var(--gold);

      font-size: 24px;
      line-height: 1;

      transform:
        translateY(-1px);
    }


    /* ==================================================
       提示訊息
    ================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 30px;

      z-index: 100;

      width:
        calc(100% - 40px);

      max-width: 420px;

      padding: 16px 18px;

      border:
        1px solid
        rgba(247,181,0,.35);

      border-radius: 16px;

      background:
        rgba(4,39,65,.97);

      color: var(--white);

      text-align: center;

      font-size: 14px;
      font-weight: 700;

      box-shadow:
        0 15px 35px
        rgba(0,0,0,.3);

      opacity: 0;

      pointer-events: none;

      transform:
        translateX(-50%)
        translateY(18px);

      transition:
        .25s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* ==================================================
       手機版
    ================================================== */

    @media (max-width: 600px) {

      .container {
        width:
          calc(100% - 24px);
      }

      .site-header-inner {
        min-height: 70px;

        padding:
          10px 0;
      }

      .logo-area img {
        max-width: 190px;
        max-height: 40px;
      }

      .campaign-image {
        width: 100%;
        max-width: 100%;
      }

      .section {
        padding:
          29px 0;
      }

      .booking-section {
        padding-top: 22px;
      }

      .section-header {
        margin-bottom: 17px;
      }

      .section-title {
        font-size: 24px;
      }

      .section-subtitle {
        font-size: 13px;
      }

      .booking-card {
        width: 100%;
        min-width: 0;

        padding:
          20px 17px;

        border-radius: 19px;
      }

      .form {
        gap: 16px;
      }

      input,
      select {
        min-height: 50px;
      }

      .store-button {
        min-height: 56px;

        padding:
          8px 5px;

        font-size: 13px;
      }

      .agreement {
        padding:
          14px;
      }

      .agreement-text {
        font-size: 12.5px;
      }

      .submit-button {
        min-height: 54px;
      }

      .activity-card,
      .information-card {
        border-radius: 19px;
      }

      .activity-item {
        padding:
          18px 17px;
      }

      .info-link {
        min-height: 64px;

        padding:
          0 17px;
      }

    }

  </style>
</head>


<body>


  <!-- ==================================================
       頂端 Logo
  =================================================== -->

  <header class="site-header">

    <div class="container site-header-inner">

      <div class="logo-area">

        <img
          src="site logo.png"
          alt="黑盒子維修中心"
        >

      </div>

    </div>

  </header>



  <!-- ==================================================
       活動主視覺
  =================================================== -->

  <section class="campaign-visual">

    <div class="campaign-image">

      <img
        src="membership_offer.png"
        alt="中秋月禮會員專屬優惠"
      >

    </div>

  </section>



  <!-- ==================================================
       預約
  =================================================== -->

  <section
    class="section booking-section"
  >

    <div class="container">


      <div class="section-header">

        <h2 class="section-title">
          預約
        </h2>

        <p class="section-subtitle">
          選擇門市與希望到店時間，完成活動預約。
        </p>

      </div>



      <div class="booking-card">

        <form
          id="bookingForm"
          class="form"
        >


          <!-- 姓名 -->

          <div class="field">

            <label
              for="name"
              class="required"
            >
              姓名
            </label>

            <input
              id="name"
              name="name"
              type="text"
              placeholder="請輸入姓名"
              autocomplete="name"
              required
            >

          </div>



          <!-- 聯絡電話 -->

          <div class="field">

            <label
              for="phone"
              class="required"
            >
              聯絡電話
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              placeholder="例如：0912345678"
              autocomplete="tel"
              required
            >

          </div>



          <!-- ==================================================
               手機型號
          =================================================== -->

          <div class="field">

            <label
              for="device"
              class="required"
            >
              手機型號
            </label>

            <select
              id="device"
              name="device"
              required
            >

              <option value="">
                請選擇手機型號
              </option>


              <optgroup label="iPhone 17 系列">

                <option value="iPhone 17 Pro">
                  iPhone 17 Pro
                </option>

                <option value="iPhone 17 Pro Max">
                  iPhone 17 Pro Max
                </option>

                <option value="iPhone Air">
                  iPhone Air
                </option>

                <option value="iPhone 17">
                  iPhone 17
                </option>

                <option value="iPhone 17e">
                  iPhone 17e
                </option>

              </optgroup>


              <optgroup label="更多 iPhone 機型">

                <option value="iPhone 16 Pro">
                  iPhone 16 Pro
                </option>

                <option value="iPhone 16 Pro Max">
                  iPhone 16 Pro Max
                </option>

                <option value="iPhone 16">
                  iPhone 16
                </option>

                <option value="iPhone 16 Plus">
                  iPhone 16 Plus
                </option>

                <option value="iPhone 16e">
                  iPhone 16e
                </option>


                <option value="iPhone 15 Pro">
                  iPhone 15 Pro
                </option>

                <option value="iPhone 15 Pro Max">
                  iPhone 15 Pro Max
                </option>

                <option value="iPhone 15">
                  iPhone 15
                </option>

                <option value="iPhone 15 Plus">
                  iPhone 15 Plus
                </option>


                <option value="iPhone 14 Pro">
                  iPhone 14 Pro
                </option>

                <option value="iPhone 14 Pro Max">
                  iPhone 14 Pro Max
                </option>

                <option value="iPhone 14">
                  iPhone 14
                </option>

                <option value="iPhone 14 Plus">
                  iPhone 14 Plus
                </option>


                <option value="iPhone 13 Pro">
                  iPhone 13 Pro
                </option>

                <option value="iPhone 13 Pro Max">
                  iPhone 13 Pro Max
                </option>

                <option value="iPhone 13 mini">
                  iPhone 13 mini
                </option>

                <option value="iPhone 13">
                  iPhone 13
                </option>


                <option value="iPhone SE（第 3 代）">
                  iPhone SE（第 3 代）
                </option>


                <option value="iPhone 12 Pro">
                  iPhone 12 Pro
                </option>

                <option value="iPhone 12 Pro Max">
                  iPhone 12 Pro Max
                </option>

                <option value="iPhone 12 mini">
                  iPhone 12 mini
                </option>

                <option value="iPhone 12">
                  iPhone 12
                </option>


                <option value="iPhone 11 Pro">
                  iPhone 11 Pro
                </option>

                <option value="iPhone 11 Pro Max">
                  iPhone 11 Pro Max
                </option>

                <option value="iPhone 11">
                  iPhone 11
                </option>


                <option value="iPhone SE（第 2 代）">
                  iPhone SE（第 2 代）
                </option>


                <option value="iPhone XS">
                  iPhone XS
                </option>

                <option value="iPhone XS Max">
                  iPhone XS Max
                </option>

                <option value="iPhone XR">
                  iPhone XR
                </option>

              </optgroup>

            </select>

          </div>



          <!-- ==================================================
               預約門市
               左右兩個按鈕
          =================================================== -->

          <div class="field">

            <label class="required">
              預約門市
            </label>


            <div
              class="store-options"
              role="radiogroup"
              aria-label="預約門市"
            >

              <button
                type="button"
                class="store-button"
                data-store="勤美旗艦門市"
                role="radio"
                aria-checked="false"
              >
                勤美旗艦門市
              </button>


              <button
                type="button"
                class="store-button"
                data-store="沙鹿站前門市"
                role="radio"
                aria-checked="false"
              >
                沙鹿站前門市
              </button>

            </div>


            <!--
              真正送出資料時使用，
              使用者不會看到
            -->

            <input
              type="hidden"
              id="store"
              name="store"
              value=""
            >

          </div>



          <!-- ==================================================
               預約日期
          =================================================== -->

          <div class="field date-field">

            <label
              for="date"
              class="required"
            >
              預約日期
            </label>

            <input
              id="date"
              name="date"
              type="date"
              max="2026-09-30"
              required
            >

          </div>



          <!-- ==================================================
               預約時段
               依門市動態載入
          =================================================== -->

          <div class="field">

            <label
              for="time"
              class="required"
            >
              預約時段
            </label>

            <select
              id="time"
              name="time"
              required
              disabled
            >

              <option value="">
                請先選擇預約門市
              </option>

            </select>

          </div>



          <!-- ==================================================
               活動確認
          =================================================== -->

          <label
            class="agreement"
            for="agreement"
          >

            <input
              id="agreement"
              name="agreement"
              type="checkbox"
              required
            >

            <span class="agreement-text">
              我已知悉該活動每位會員僅能獲得優惠一次，確認進行預約！
            </span>

          </label>



          <!-- ==================================================
               送出
          =================================================== -->

          <button
            type="submit"
            class="submit-button"
          >
            確認預約
          </button>


        </form>

      </div>

    </div>

  </section>



  <!-- ==================================================
       活動說明
  =================================================== -->

  <section class="section">

    <div class="container">


      <div class="section-header">

        <h2 class="section-title">
          活動說明
        </h2>

      </div>



      <div class="activity-card">


        <div class="activity-item">

          <div class="activity-number">
            1
          </div>

          <div class="activity-content">

            <div class="activity-title">
              活動期間
            </div>

            <div class="activity-text">
              即日起至 9/30 止。
            </div>

          </div>

        </div>



        <div class="activity-item">

          <div class="activity-number">
            2
          </div>

          <div class="activity-content">

            <div class="activity-title">
              會員限定
            </div>

            <div class="activity-text">
              本活動僅限符合資格之黑盒子會員使用。
            </div>

          </div>

        </div>



        <div class="activity-item">

          <div class="activity-number">
            3
          </div>

          <div class="activity-content">

            <div class="activity-title">
              每位會員限兌換一次
            </div>

            <div class="activity-text">

        <a

  <!-- ==================================================
       提示
  =================================================== -->

  <div
    id="toast"
    class="toast"
  >
    預約資料已送出
  </div>



  <script>

    /* ==================================================
       取得元素
    ================================================== */

    const form =
      document.getElementById("bookingForm");

    const storeInput =
      document.getElementById("store");

    const storeButtons =
      document.querySelectorAll(".store-button");

    const timeSelect =
      document.getElementById("time");

    const dateInput =
      document.getElementById("date");

    const toast =
      document.getElementById("toast");



    /* ==================================================
       預約日期限制

       最早：今天
       最晚：2026/09/30
    ================================================== */

    const today =
      new Date();

    const todayString =
      [
        today.getFullYear(),
        String(
          today.getMonth() + 1
        ).padStart(2, "0"),
        String(
          today.getDate()
        ).padStart(2, "0")
      ].join("-");


    const campaignEndDate =
      "2026-09-30";


    dateInput.min =
      todayString;

    dateInput.max =
      campaignEndDate;



    /* ==================================================
       各門市時段設定
    ================================================== */

    const storeTimes = {

      "勤美旗艦門市": [
        "11:00",
        "12:00",
        "13:00",
        "14:00",
        "15:00",
        "16:00",
        "17:00",
        "18:00",
        "19:00"
      ],

      "沙鹿站前門市": [
        "12:00",
        "13:00",
        "14:00",
        "15:00",
        "16:00",
        "17:00",
        "18:00",
        "19:00",
        "20:00"
      ]

    };



    /* ==================================================
       更新預約時段
    ================================================== */

    function updateTimeOptions(storeName) {

      timeSelect.innerHTML = "";


      const placeholder =
        document.createElement("option");

      placeholder.value = "";

      placeholder.textContent =
        "請選擇預約時段";

      timeSelect.appendChild(
        placeholder
      );


      if (
        !storeName ||
        !storeTimes[storeName]
      ) {

        timeSelect.disabled =
          true;

        placeholder.textContent =
          "請先選擇預約門市";

        return;

      }


      storeTimes[
        storeName
      ].forEach(
        function(time) {

          const option =
            document.createElement("option");

          option.value =
            time;

          option.textContent =
            time;

          timeSelect.appendChild(
            option
          );

        }
      );


      timeSelect.disabled =
        false;

    }



    /* ==================================================
       門市按鈕
    ================================================== */

    storeButtons.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            const selectedStore =
              button.dataset.store;


            /* 清除原本選取狀態 */

            storeButtons.forEach(
              function(item) {

                item.classList.remove(
                  "selected"
                );

                item.setAttribute(
                  "aria-checked",
                  "false"
                );

              }
            );


            /* 設定目前選取 */

            button.classList.add(
              "selected"
            );

            button.setAttribute(
              "aria-checked",
              "true"
            );


            /* 寫入隱藏欄位 */

            storeInput.value =
              selectedStore;


            /* 更新時間 */

            updateTimeOptions(
              selectedStore
            );

          }
        );

      }
    );



    /* ==================================================
       額外檢查日期
    ================================================== */

    dateInput.addEventListener(
      "change",
      function() {

        if (!dateInput.value) {
          return;
        }


        if (
          dateInput.value <
          todayString
        ) {

          dateInput.value =
            "";

          showToast(
            "無法選擇今天以前的日期"
          );

          return;

        }


        if (
          dateInput.value >
          campaignEndDate
        ) {

          dateInput.value =
            "";

          showToast(
            "活動預約僅開放至 2026/09/30"
          );

        }

      }
    );



    /* ==================================================
       Toast
    ================================================== */

    let toastTimer = null;


    function showToast(message) {

      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );


      if (toastTimer) {

        clearTimeout(
          toastTimer
        );

      }


      toastTimer =
        setTimeout(
          function() {

            toast.classList.remove(
              "show"
            );

          },
          2300
        );

    }



    /* ==================================================
       表單送出
       目前仍為前端示意
    ================================================== */

    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        /* 必須選擇門市 */

        if (
          !storeInput.value
        ) {

          showToast(
            "請選擇預約門市"
          );

          return;

        }


        /* 必須選擇時段 */

        if (
          !timeSelect.value
        ) {

          showToast(
            "請選擇預約時段"
          );

          return;

        }


        /* 日期確認 */

        if (
          !dateInput.value
        ) {

          showToast(
            "請選擇預約日期"
          );

          return;

        }


        if (
          dateInput.value <
          todayString ||
          dateInput.value >
          campaignEndDate
        ) {

          showToast(
            "請選擇有效的活動日期"
          );

          return;

        }


        /*
          後續正式串接 Supabase 時，
          可以在這裡讀取：

          name
          phone
          device
          store
          date
          time

          並寫入預約資料表。
        */


        showToast(
          "預約資料已送出"
        );

      }
    );



    /* ==================================================
       初始化
    ================================================== */

    updateTimeOptions("");

  </script>


</body>
