<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />

  <title>中秋月禮｜會員限定活動</title>

  <style>
    :root {
      --navy: #042741;
      --navy-deep: #031c30;
      --gold: #f7b500;
      --gold-light: #ffd65c;
      --white: #ffffff;

      --text-soft: rgba(255,255,255,.68);
      --line: rgba(255,255,255,.10);

      --radius: 22px;
      --shadow: 0 12px 32px rgba(0,0,0,.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      background: var(--navy);
      color: var(--white);
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
    }


    /* ==================================================
       共用
    ================================================== */

    .container {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
    }

    .section {
      padding: 34px 0;
    }

    .section-header {
      margin-bottom: 20px;
    }

    .section-title {
      margin: 0 0 8px;
      color: var(--white);
      font-size: 26px;
      font-weight: 850;
      letter-spacing: .4px;
    }

    .section-subtitle {
      margin: 0;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.7;
    }


    /* ==================================================
       頂端 LOGO
    ================================================== */

    .site-header {
      position: relative;
      z-index: 10;
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid rgba(0,0,0,.055);
    }

    .site-header-inner {
      min-height: 78px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 12px 0;
    }

    .logo-area {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-area img {
      width: auto;
      height: auto;

      max-width: 220px;
      max-height: 48px;

      object-fit: contain;
    }


    /* ==================================================
       活動主視覺
    ================================================== */

    .campaign-visual {
      width: 100%;
      margin: 0;
      padding: 0;

      background: var(--navy);

      overflow: hidden;
    }

    .campaign-image {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;
      padding: 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      box-shadow: none;
    }

    .campaign-image img {
      width: 100%;
      height: auto;

      margin: 0;
      padding: 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      box-shadow: none;
    }


    /* ==================================================
       預約區
    ================================================== */

    .booking-section {
      padding-top: 28px;
      background: var(--navy);
    }

    .booking-card {
      width: 100%;
      min-width: 0;
      max-width: 100%;

      padding: 24px;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.035)
        );

      box-shadow: var(--shadow);
    }

    .form {
      width: 100%;
      min-width: 0;
      max-width: 100%;

      display: grid;
      gap: 18px;
    }

    .field {
      width: 100%;
      min-width: 0;
      max-width: 100%;

      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--white);
      font-size: 14px;
      font-weight: 750;
    }

    .required::after {
      content: " *";
      color: var(--gold);
    }


    /* ==================================================
       一般輸入欄
    ================================================== */

    input,
    select {
      display: block;

      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 52px;

      box-sizing: border-box;

      padding: 0 15px;

      color: var(--white);

      border: 1px solid rgba(255,255,255,.13);
      border-radius: 14px;

      background: rgba(255,255,255,.075);

      outline: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input::placeholder {
      color: rgba(255,255,255,.36);
    }

    input:focus,
    select:focus {
      border-color: var(--gold);

      background: rgba(255,255,255,.095);

      box-shadow:
        0 0 0 3px rgba(247,181,0,.12);
    }

    select {
      cursor: pointer;
    }

    select option {
      color: #111111;
      background: #ffffff;
    }

    select optgroup {
      color: #777777;
      background: #ffffff;
      font-weight: 700;
    }

    select:disabled {
      cursor: not-allowed;

      color: rgba(255,255,255,.35);

      background: rgba(255,255,255,.04);
      border-color: rgba(255,255,255,.08);

      opacity: 1;
    }


    /* ==================================================
       門市選擇
    ================================================== */

    .store-options {
      width: 100%;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 10px;
    }

    .store-button {
      width: 100%;
      min-width: 0;
      min-height: 58px;

      padding: 10px 8px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.15);
      border-radius: 15px;

      background: rgba(255,255,255,.065);

      color: rgba(255,255,255,.82);

      font-size: 14px;
      font-weight: 750;

      text-align: center;

      cursor: pointer;

      transition:
        background .18s ease,
        border-color .18s ease,
        color .18s ease,
        transform .15s ease,
        box-shadow .18s ease;
    }

    .store-button:hover {
      background: rgba(255,255,255,.09);
    }

    .store-button:active {
      transform: scale(.98);
    }

    .store-button.selected {
      color: var(--navy);

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      border-color: var(--gold);

      box-shadow:
        0 8px 22px rgba(247,181,0,.18);
    }

    .store-button.selected::before {
      content: "✓";
      margin-right: 6px;
      font-size: 14px;
      font-weight: 900;
    }


    /* ==================================================
       2026 年 9 月專屬月曆
    ================================================== */

    .calendar {
      width: 100%;
      max-width: 100%;

      padding: 16px;

      border: 1px solid rgba(255,255,255,.13);
      border-radius: 16px;

      background: rgba(255,255,255,.055);

      overflow: hidden;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 1px 0 15px;

      color: var(--white);

      font-size: 16px;
      font-weight: 800;
    }

    .calendar-weekdays,
    .calendar-days {
      display: grid;

      grid-template-columns:
        repeat(7, minmax(0, 1fr));

      gap: 6px;
    }

    .calendar-weekdays {
      margin-bottom: 7px;
    }

    .calendar-weekday {
      display: flex;
      align-items: center;
      justify-content: center;

      height: 28px;

      color: rgba(255,255,255,.48);

      font-size: 11px;
      font-weight: 700;
    }

    .calendar-day {
      aspect-ratio: 1 / 1;

      width: 100%;
      min-width: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid transparent;
      border-radius: 10px;

      background: transparent;

      color: rgba(255,255,255,.88);

      font-size: 13px;
      font-weight: 650;

      cursor: pointer;

      transition:
        background .15s ease,
        color .15s ease,
        border-color .15s ease,
        transform .12s ease;
    }

    .calendar-day:hover {
      background: rgba(255,255,255,.08);
    }

    .calendar-day:active {
      transform: scale(.94);
    }

    .calendar-day.selected {
      background: var(--gold);
      color: var(--navy);

      border-color: var(--gold);

      font-weight: 850;

      box-shadow:
        0 5px 14px rgba(247,181,0,.18);
    }

    .calendar-day.disabled {
      color: rgba(255,255,255,.18);

      cursor: default;
      pointer-events: none;
    }

    .calendar-empty {
      aspect-ratio: 1 / 1;
    }

    .selected-date-display {
      display: none;

      margin-top: 10px;

      color: var(--gold);

      font-size: 13px;
      font-weight: 750;
    }

    .selected-date-display.show {
      display: block;
    }


    /* ==================================================
       核選框
       不使用外層框線 / 底色
    ================================================== */

    .agreement {
      width: 100%;

      display: flex;
      align-items: flex-start;

      gap: 11px;

      padding: 2px 2px 0;

      background: transparent;
      border: 0;
      border-radius: 0;

      cursor: pointer;
    }

    .agreement input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;

      flex: 0 0 22px;

      width: 22px;
      height: 22px;

      min-width: 22px;
      min-height: 22px;

      margin: 1px 0 0;
      padding: 0;

      display: grid;
      place-content: center;

      border:
        1.5px solid rgba(255,255,255,.5);

      border-radius: 6px;

      background:
        rgba(255,255,255,.05);

      cursor: pointer;
    }

    .agreement input[type="checkbox"]::before {
      content: "";

      width: 10px;
      height: 6px;

      border-left:
        2px solid var(--navy);

      border-bottom:
        2px solid var(--navy);

      transform:
        rotate(-45deg)
        scale(0);

      transition:
        transform .12s ease;
    }

    .agreement input[type="checkbox"]:checked {
      border-color: var(--gold);
      background: var(--gold);
    }

    .agreement input[type="checkbox"]:checked::before {
      transform:
        rotate(-45deg)
        scale(1);
    }

    .agreement-text {
      color: rgba(255,255,255,.88);

      font-size: 13px;
      line-height: 1.65;

      font-weight: 650;
    }


    /* ==================================================
       確認預約
    ================================================== */

    .submit-button {
      width: 100%;
      min-height: 56px;

      margin-top: 3px;

      border: 0;
      border-radius: 16px;

      color: var(--navy);

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      font-size: 17px;
      font-weight: 850;

      box-shadow:
        0 10px 26px rgba(247,181,0,.23);

      cursor: pointer;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .submit-button:hover {
      box-shadow:
        0 12px 30px rgba(247,181,0,.3);
    }

    .submit-button:active {
      transform: scale(.985);
    }


    /* ==================================================
       活動說明
    ================================================== */

    .activity-card {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      background: rgba(255,255,255,.055);
    }

    .activity-item {
      display: flex;
      align-items: flex-start;

      gap: 15px;

      padding: 19px 20px;

      border-bottom:
        1px solid var(--line);
    }

    .activity-item:last-child {
      border-bottom: 0;
    }

    .activity-number {
      flex: 0 0 30px;

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(247,181,0,.14);

      color: var(--gold);

      font-size: 13px;
      font-weight: 850;
    }

    .activity-content {
      min-width: 0;
      padding-top: 2px;
    }

    .activity-title {
      margin-bottom: 5px;

      color: var(--white);

      font-size: 15px;
      font-weight: 800;
    }

    .activity-text {
      color: var(--text-soft);

      font-size: 13px;
      line-height: 1.75;
    }


    /* ==================================================
       資訊
    ================================================== */

    .information-section {
      padding-bottom: 56px;
    }

    .information-card {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      background: rgba(255,255,255,.055);
    }

    .info-link {
      min-height: 66px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      padding: 0 20px;

      border-bottom:
        1px solid var(--line);

      transition:
        background .18s ease;
    }

    .info-link:last-child {
      border-bottom: 0;
    }

    .info-link:hover {
      background:
        rgba(255,255,255,.045);
    }

    .info-link:active {
      background:
        rgba(255,255,255,.08);
    }

    .info-name {
      color: var(--white);

      font-size: 15px;
      font-weight: 750;
    }

    .info-arrow {
      color: var(--gold);

      font-size: 24px;
      line-height: 1;

      transform:
        translateY(-1px);
    }


    /* ==================================================
       Toast
    ================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 30px;

      z-index: 100;

      width: calc(100% - 40px);
      max-width: 420px;

      padding: 16px 18px;

      border:
        1px solid rgba(247,181,0,.35);

      border-radius: 16px;

      background:
        rgba(4,39,65,.97);

      color: var(--white);

      text-align: center;

      font-size: 14px;
      font-weight: 700;

      box-shadow:
        0 15px 35px rgba(0,0,0,.3);

      opacity: 0;
      pointer-events: none;

      transform:
        translateX(-50%)
        translateY(18px);

      transition:
        .25s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* ==================================================
       手機
    ================================================== */

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 24px);
      }

      .site-header-inner {
        min-height: 70px;
        padding: 10px 0;
      }

      .logo-area img {
        max-width: 190px;
        max-height: 40px;
      }

      .campaign-image {
        width: 100%;
        max-width: 100%;
      }

      .section {
        padding: 29px 0;
      }

      .booking-section {
        padding-top: 22px;
      }

      .section-header {
        margin-bottom: 17px;
      }

      .section-title {
        font-size: 24px;
      }

      .section-subtitle {
        font-size: 13px;
      }

      .booking-card {
        width: 100%;
        min-width: 0;

        padding: 20px 17px;

        border-radius: 19px;
      }

      .form {
        gap: 17px;
      }

      input,
      select {
        min-height: 50px;
      }

      .store-button {
        min-height: 56px;

        padding: 8px 4px;

        font-size: 13px;
      }

      .calendar {
        padding: 13px 10px;
      }

      .calendar-header {
        padding-bottom: 12px;
        font-size: 15px;
      }

      .calendar-weekdays,
      .calendar-days {
        gap: 4px;
      }

      .calendar-day {
        border-radius: 9px;
        font-size: 12px;
      }

      .calendar-weekday {
        font-size: 10px;
      }

      .agreement-text {
        font-size: 12.5px;
      }

      .submit-button {
        min-height: 54px;
      }

      .activity-card,
      .information-card {
        border-radius: 19px;
      }

      .activity-item {
        padding: 18px 17px;
      }

      .info-link {
        min-height: 64px;
        padding: 0 17px;
      }

    }

  </style>
</head>


<body>


  <!-- ==================================================
       頂端 Logo
  =================================================== -->

  <header class="site-header">

    <div class="container site-header-inner">

      <div class="logo-area">

        <img
          src="site logo.png"
          alt="黑盒子維修中心"
        >

      </div>

    </div>

  </header>



  <!-- ==================================================
       活動主視覺
  =================================================== -->

  <section class="campaign-visual">

    <div class="campaign-image">

      <img
        src="membership_offer.png"
        alt="中秋月禮會員專屬優惠"
      >

    </div>

  </section>



  <!-- ==================================================
       預約
  =================================================== -->

  <section class="section booking-section">

    <div class="container">


      <div class="section-header">

        <h2 class="section-title">
          預約
        </h2>

        <p class="section-subtitle">
          選擇門市與希望到店時間，完成活動預約。
        </p>

      </div>



      <div class="booking-card">

        <form
          id="bookingForm"
          class="form"
        >


          <!-- 姓名 -->

          <div class="field">

            <label
              for="name"
              class="required"
            >
              姓名
            </label>

            <input
              id="name"
              name="name"
              type="text"
              placeholder="請輸入姓名"
              autocomplete="name"
              required
            >

          </div>



          <!-- 電話 -->

          <div class="field">

            <label
              for="phone"
              class="required"
            >
              聯絡電話
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              placeholder="例如：0912345678"
              autocomplete="tel"
              required
            >

          </div>



          <!-- 手機型號 -->

          <div class="field">

            <label
              for="device"
              class="required"
            >
              手機型號
            </label>

            <select
              id="device"
              name="device"
              required
            >

              <option value="">
                請選擇手機型號
              </option>


              <optgroup label="iPhone 17 系列">

                <option value="iPhone 17 Pro">
                  iPhone 17 Pro
                </option>

                <option value="iPhone 17 Pro Max">
                  iPhone 17 Pro Max
                </option>

                <option value="iPhone Air">
                  iPhone Air
                </option>

                <option value="iPhone 17">
                  iPhone 17
                </option>

                <option value="iPhone 17e">
                  iPhone 17e
                </option>

              </optgroup>


              <optgroup label="更多 iPhone 機型">

                <option value="iPhone 16 Pro">
                  iPhone 16 Pro
                </option>

                <option value="iPhone 16 Pro Max">
                  iPhone 16 Pro Max
                </option>

                <option value="iPhone 16">
                  iPhone 16
                </option>

                <option value="iPhone 16 Plus">
                  iPhone 16 Plus
                </option>

                <option value="iPhone 16e">
                  iPhone 16e
                </option>

                <option value="iPhone 15 Pro">
                  iPhone 15 Pro
                </option>

                <option value="iPhone 15 Pro Max">
                  iPhone 15 Pro Max
                </option>

                <option value="iPhone 15">
                  iPhone 15
                </option>

                <option value="iPhone 15 Plus">
                  iPhone 15 Plus
                </option>

                <option value="iPhone 14 Pro">
                  iPhone 14 Pro
                </option>

                <option value="iPhone 14 Pro Max">
                  iPhone 14 Pro Max
                </option>

                <option value="iPhone 14">
                  iPhone 14
                </option>

                <option value="iPhone 14 Plus">
                  iPhone 14 Plus
                </option>

                <option value="iPhone 13 Pro">
                  iPhone 13 Pro
                </option>

                <option value="iPhone 13 Pro Max">
                  iPhone 13 Pro Max
                </option>

                <option value="iPhone 13 mini">
                  iPhone 13 mini
                </option>

                <option value="iPhone 13">
                  iPhone 13
                </option>

                <option value="iPhone SE（第 3 代）">
                  iPhone SE（第 3 代）
                </option>

                <option value="iPhone 12 Pro">
                  iPhone 12 Pro
                </option>

                <option value="iPhone 12 Pro Max">
                  iPhone 12 Pro Max
                </option>

                <option value="iPhone 12 mini">
                  iPhone 12 mini
                </option>

                <option value="iPhone 12">
                  iPhone 12
                </option>

                <option value="iPhone 11 Pro">
                  iPhone 11 Pro
                </option>

                <option value="iPhone 11 Pro Max">
                  iPhone 11 Pro Max
                </option>

                <option value="iPhone 11">
                  iPhone 11
                </option>

                <option value="iPhone SE（第 2 代）">
                  iPhone SE（第 2 代）
                </option>

                <option value="iPhone XS">
                  iPhone XS
                </option>

                <option value="iPhone XS Max">
                  iPhone XS Max
                </option>

                <option value="iPhone XR">
                  iPhone XR
                </option>

              </optgroup>

            </select>

          </div>



          <!-- 預約門市 -->

          <div class="field">

            <label class="required">
              預約門市
            </label>

            <div
              class="store-options"
              role="radiogroup"
              aria-label="預約門市"
            >

              <button
                type="button"
                class="store-button"
                data-store="勤美旗艦門市"
                role="radio"
                aria-checked="false"
              >
                勤美旗艦門市
              </button>

              <button
                type="button"
                class="store-button"
                data-store="沙鹿站前門市"
                role="radio"
                aria-checked="false"
              >
                沙鹿站前門市
              </button>

            </div>

            <input
              type="hidden"
              id="store"
              name="store"
              value=""
            >

          </div>



          <!-- ==================================================
               預約日期
               僅顯示 2026 年 9 月
          =================================================== -->

          <div class="field">

            <label class="required">
              預約日期
            </label>


            <div
              class="calendar"
              id="calendar"
            >

              <div class="calendar-header">
                2026 年 9 月
              </div>


              <div class="calendar-weekdays">

                <div class="calendar-weekday">日</div>
                <div class="calendar-weekday">一</div>
                <div class="calendar-weekday">二</div>
                <div class="calendar-weekday">三</div>
                <div class="calendar-weekday">四</div>
                <div class="calendar-weekday">五</div>
                <div class="calendar-weekday">六</div>

              </div>


              <div
                class="calendar-days"
                id="calendarDays"
              ></div>


              <div
                class="selected-date-display"
                id="selectedDateDisplay"
              ></div>

            </div>


            <input
              type="hidden"
              id="date"
              name="date"
              value=""
            >

          </div>

  <!-- ==================================================
       Toast
  =================================================== -->

  <div
    id="toast"
    class="toast"
  >
    預約資料已送出
  </div>



  <script>

    /* ==================================================
       元素
    ================================================== */

    const form =
      document.getElementById("bookingForm");

    const storeInput =
      document.getElementById("store");

    const storeButtons =
      document.querySelectorAll(".store-button");

    const timeSelect =
      document.getElementById("time");

    const dateInput =
      document.getElementById("date");

    const calendarDays =
      document.getElementById("calendarDays");

    const selectedDateDisplay =
      document.getElementById("selectedDateDisplay");

    const agreement =
      document.getElementById("agreement");

    const toast =
      document.getElementById("toast");



    /* ==================================================
       門市時段
    ================================================== */

    const storeTimes = {

      "勤美旗艦門市": [
        "11:00",
        "12:00",
        "13:00",
        "14:00",
        "15:00",
        "16:00",
        "17:00",
        "18:00",
        "19:00"
      ],

      "沙鹿站前門市": [
        "12:00",
        "13:00",
        "14:00",
        "15:00",
        "16:00",
        "17:00",
        "18:00",
        "19:00",
        "20:00"
      ]

    };



    /* ==================================================
       更新時段
    ================================================== */

    function updateTimeOptions(storeName) {

      timeSelect.innerHTML = "";


      const placeholder =
        document.createElement("option");

      placeholder.value = "";

      placeholder.textContent =
        "請選擇預約時段";

      timeSelect.appendChild(
        placeholder
      );


      if (
        !storeName ||
        !storeTimes[storeName]
      ) {

        timeSelect.disabled = true;

        placeholder.textContent =
          "請先選擇預約門市";

        return;

      }


      storeTimes[storeName].forEach(
        function(time) {

          const option =
            document.createElement("option");

          option.value =
            time;

          option.textContent =
            time;

          timeSelect.appendChild(
            option
          );

        }
      );


      timeSelect.disabled =
        false;

    }



    /* ==================================================
       門市選擇
    ================================================== */

    storeButtons.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            const selectedStore =
              button.dataset.store;


            storeButtons.forEach(
              function(item) {

                item.classList.remove(
                  "selected"
                );

                item.setAttribute(
                  "aria-checked",
                  "false"
                );

              }
            );


            button.classList.add(
              "selected"
            );

            button.setAttribute(
              "aria-checked",
              "true"
            );


            storeInput.value =
              selectedStore;


            updateTimeOptions(
              selectedStore
            );

          }
        );

      }
    );



    /* ==================================================
       產生 2026 年 9 月月曆
    ================================================== */

    const calendarYear =
      2026;

    const calendarMonth =
      8;
      // JS 月份從 0 開始
      // 8 = 九月


    const firstDay =
      new Date(
        calendarYear,
        calendarMonth,
        1
      ).getDay();


    const daysInMonth =
      new Date(
        calendarYear,
        calendarMonth + 1,
        0
      ).getDate();


    /*
      補上九月一號以前的空格
    */

    for (
      let i = 0;
      i < firstDay;
      i++
    ) {

      const empty =
        document.createElement("div");

      empty.className =
        "calendar-empty";

      calendarDays.appendChild(
        empty
      );

    }



    /*
      建立 1 ～ 30 日
    */

    for (
      let day = 1;
      day <= daysInMonth;
      day++
    ) {

      const button =
        document.createElement("button");

      button.type =
        "button";

      button.className =
        "calendar-day";

      button.textContent =
        day;


      const dayText =
        String(day).padStart(
          2,
          "0"
        );


      const dateValue =
        `2026-09-${dayText}`;


      button.dataset.date =
        dateValue;


      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(
              ".calendar-day"
            )
            .forEach(
              function(item) {

                item.classList.remove(
                  "selected"
                );

              }
            );


          button.classList.add(
            "selected"
          );


          dateInput.value =
            dateValue;


          selectedDateDisplay.textContent =
            `已選擇：2026 / 09 / ${dayText}`;


          selectedDateDisplay.classList.add(
            "show"
          );

        }
      );


      calendarDays.appendChild(
        button
      );

    }



    /* ==================================================
       Toast
    ================================================== */

    let toastTimer =
      null;


    function showToast(message) {

      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );


      if (toastTimer) {

        clearTimeout(
          toastTimer
        );

      }


      toastTimer =
        setTimeout(
          function() {

            toast.classList.remove(
              "show"
            );

          },
          2300
        );

    }



    /* ==================================================
       表單送出
       現階段仍為前端示意
    ================================================== */

    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        if (
          !storeInput.value
        ) {

          showToast(
            "請選擇預約門市"
          );

          return;

        }


        if (
          !dateInput.value
        ) {

          showToast(
            "請選擇預約日期"
          );

          return;

        }


        if (
          !timeSelect.value
        ) {

          showToast(
            "請選擇預約時段"
          );

          return;

        }


        if (
          !agreement.checked
        ) {

          showToast(
            "請先確認活動使用規則"
          );

          return;

        }


        /*
          下一步接 Supabase 時可取得：

          姓名：
          document.getElementById("name").value

          電話：
          document.getElementById("phone").value

          型號：
          document.getElementById("device").value

          門市：
          storeInput.value

          日期：
          dateInput.value

          時段：
          timeSelect.value
        */


        showToast(
          "預約資料已送出"
        );

      }
    );



    /* ==================================================
       初始化
    ================================================== */

    updateTimeOptions("");

  </script>
